<style>

</style></head><body>
<header><h1>🏆 GOLDEN LEAGUE · SIMULADOR</h1><small>Crea, edita y simula todo · se guarda en tu navegador</small></header>
<nav id="nav"></nav><main id="app"></main><div id="md" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,8),R=(a,b)=>a+Math.random()*(b-a)|0,f2=n=>(+n).toFixed(2).replace(/\.00$/,'');
const KEY='gl_sim_v2',TABS=['🎮 Simulador','👤 Borrushers','🛡 Borrusquads','🌍 Borrunations','🏆 Competiciones','📊 Estadísticas','🥇 Palmarés','⭐ Golden Awards','💾 Datos'],PT=[15,12,10,8,7,6,5,4,3,2,1,0];
const KD=c=>c.tipo=='n'?['n','j']:['j','e'],TIPO={j:'👤 Borrushers',e:'🛡 Borrusquads',n:'🌍 Borrunations'};
const ef=o=>o<=75?o:75+(o-75)*.5,ov=p=>Math.round(p.ovr),dvs=P=>{const d=P.reduce((s,r)=>s+(r.dv||0),0);return(d>=0?'+':'')+f2(d)};
function rate(c,ps,rows){if(!S.cfg.auto||!c.imp||rows.length<2)return;const n=rows.length,o=[...ps].sort((a,b)=>b.ovr-a.ovr),ex=p=>1-2*o.indexOf(p)/(n-1);
 const g=Math.max(1,Math.round(n*.2)),g2=Math.max(1,Math.round(n*.06));rows.forEach(r=>{const p=G('jug',r.p);if(!p)return;const pf=1-2*(r.pos-1)/(n-1),t=(Math.min(99,Math.max(40,p.ovr))-40)/59,q=pf-.75*ex(p)-.15*(t-.5);let d=2*S.cfg.k*c.imp*q*(q>=0?1.2-.4*t:.7+.5*t);if(r.pos<=g)d=Math.max(d,0);if(r.pos>n-g2)d=Math.min(d,0);const nv=Math.min(99,Math.max(40,p.ovr+d));r.dv=+(nv-p.ovr).toFixed(3);p.ovr=+nv.toFixed(3)})}
function resetT(){const c=comp();if(!confirm('¿Borrar partidas de la temporada actual? (también se revierten los cambios de media)'))return;S.part.filter(x=>x.c==c.id&&x.t==c.t).forEach(x=>{const p=G('jug',x.p);if(p&&x.dv)p.ovr=Math.min(99,Math.max(40,p.ovr-x.dv))});S.part=S.part.filter(x=>!(x.c==c.id&&x.t==c.t));save()}
function genAw(t){const P=S.part.filter(x=>x.t==t);if(!P.length)return;S.aw=S.aw.filter(w=>!(w.auto&&w.t==t));
 const W=x=>Math.max(.1,G('comps',x.c)?.imp??1),A={};P.forEach(x=>{const p=G('jug',x.p);if(!p)return;const a=A[p.id]??={p,pt:0,k:0,d:0,pj:0,dv:0};a.pt+=x.pt*W(x);a.k+=x.k;a.d+=x.d;a.pj++;a.dv+=x.dv||0});
 const L=Object.values(A),best=(a,f)=>a.reduce((m,x)=>!m||f(x)>f(m)?x:m,null),pl=a=>a&&{id:a.p.id,n:a.p.n},
 grp=(f,Ln,tp)=>{const B={};P.filter(x=>(G('comps',x.c)?.tipo=='n')==(tp=='n')).forEach(x=>{const p=G('jug',x.p),g=p&&G(Ln,p[f]);if(!g)return;const b=B[g.id]??={id:g.id,n:g.n,s:0,m:new Set()};b.s+=x.pt*W(x);b.m.add(p.id)});return best(Object.values(B),b=>b.s/b.m.size)},
 up=best(L,a=>a.dv);
 [['Mejor Borrusher','j',pl(best(L,a=>a.pt))],['Mejor Borrusquad','e',grp('eq','eqs','e')],['Mejor Borrunation','n',grp('nac','nacs','n')],['Borrusher Revelación','j',up&&up.dv>0?pl(up):0],['Máximo Killer','j',pl(best(L,a=>a.k))],['Mejor K/D','j',pl(best(L.filter(a=>a.pj>=3),a=>a.k/(a.d||1)))]].forEach(([pr,k,x])=>x&&S.aw.push({id:uid(),pr,k,t,pid:x.id,n:x.n,auto:1}))}
function convUI(c){if(c.tipo!='n')return'';return`<div class=mu style="margin:8px 0 2px">📋 Convocatoria: solo juegan los borrushers marcados de cada selección</div>`+c.ids.map(nid=>{const n=G('nacs',nid);if(!n)return'';const L=S.jug.filter(p=>p.nac==nid),cv=c.conv?.[nid],on=p=>!cv||cv.includes(p.id);return`<div class=row><b>🌍 ${esc(n.n)}</b><span class=mu>${L.filter(on).length}/${L.length}</span><button class="bt dl" onclick="cvAll('${c.id}','${nid}')">todos</button>${L.map(p=>`<label><input type=checkbox ${on(p)?'checked':''} onchange="cvT('${c.id}','${nid}','${p.id}')"> ${esc(p.n)} (${ov(p)})</label>`).join(' ')||'<span class=mu>Sin borrushers en esta selección</span>'}</div>`}).join('')}
function cvT(cid,nid,pid){const c=G('comps',cid);c.conv??={};const cur=c.conv[nid]??S.jug.filter(p=>p.nac==nid).map(p=>p.id),k=cur.indexOf(pid);k<0?cur.push(pid):cur.splice(k,1);c.conv[nid]=cur;save()}
function cvAll(cid,nid){delete G('comps',cid).conv[nid];save()}
function evo(c){const A={};S.part.filter(x=>x.c==c.id&&x.t==c.t&&x.dv).forEach(x=>A[x.p]=(A[x.p]||0)+x.dv);const L=Object.entries(A).map(([id,d])=>({p:G('jug',id),d})).filter(x=>x.p).sort((a,b)=>b.d-a.d),u=L.filter(x=>x.d>0).slice(0,5),w=L.filter(x=>x.d<0).slice(-5).reverse();if(!L.length)return'';
 const li=a=>a.map(x=>`${esc(x.p.n)} <b>${ov(x.p)}</b> <span style="color:${x.d>=0?'#6c6':'#d66'}">${x.d>=0?'▲ +':'▼ '}${f2(x.d)}</span>`).join('<br>')||'<span class=mu>—</span>';
 return`<div class=card><h2>📈 Evolución de medias · T${c.t}</h2><div class=grid style="grid-template-columns:1fr 1fr"><div><label>Suben</label><br>${li(u)}</div><div><label>Bajan</label><br>${li(w)}</div></div></div>`}
let S,tab=0,sc=null,st=null,sk='j';
function seed(){const N=['Steve','Alex','Notch','Herobrine','Creeper','Enderman','Zombie','Skeleton','Slime','Ghast','Blaze','Wither','Piglin','Drowned','Phantom','Warden'],E=['Dragones','Creepers','Piglins','Endermen'].map(n=>({id:uid(),n})),C=['España','México','Argentina','Chile'].map(n=>({id:uid(),n}));
const jug=N.map((n,i)=>({id:uid(),n,ovr:R(55,95),eq:E[i%4].id,nac:C[(i>>2)%4].id})),mk=(n,tipo='l',imp=1)=>({id:uid(),n,tipo,ids:(tipo=='n'?C:jug).map(x=>x.id),t:1,nj:10,pts:PT,pk:0,imp});
return{jug,eqs:E,nacs:C,comps:[mk('Golden League'),mk('Golden Cup','l',1.5),mk('Mundial Borrunations','n',2)],part:[],pal:[],aw:[]}}
function migrate(){S.aw=(S.aw||[]).filter(w=>w.pr!='Borrusher Decepción');S.eqs??=[];S.nacs??=[];S.part??=[];S.pal??=[];S.aw??=[];S.cfg??={auto:1,k:.4};S.comps=(S.comps||[]).map(c=>{if(c.tipo!='n')c.tipo='l';c.ids??=[];c.pts??=PT;c.pk??=0;c.nj??=10;c.imp??=1;c.conv??={};c.t??=1;if(c.tipo=='l'&&!c.ids.every(i=>S.jug.some(p=>p.id==i)))c.ids=S.jug.map(x=>x.id);if(c.tipo=='n'&&!c.ids.every(i=>S.nacs.some(p=>p.id==i)))c.ids=S.nacs.map(x=>x.id);return c});sc=S.comps[0]?.id}
async function boot(){try{S=JSON.parse(localStorage[KEY])}catch(e){S=null}if(!S||!S.jug){try{S=await(await fetch('data.json',{cache:'no-store'})).json()}catch(e){S=null}}if(!S||!S.jug)S=seed();migrate();try{navigator.storage?.persist?.()}catch(e){}save()}
const save=()=>{localStorage[KEY]=JSON.stringify(S);draw()},G=(a,id)=>S[a].find(x=>x.id==id),comp=()=>G('comps',sc)||S.comps[0];
const players=c=>S.jug.filter(p=>c.tipo=='n'?c.ids.includes(p.nac)&&(!c.conv?.[p.nac]||c.conv[p.nac].includes(p.id)):c.ids.includes(p.id));
function jorn(c,t){return Math.max(0,...S.part.filter(x=>x.c==c.id&&x.t==t).map(x=>x.j))}
function simJ(c){const ps=players(c);if(!ps.length)return alert('Esta competición no tiene participantes');const j=jorn(c,c.t)+1;
 const rows=ps.map(p=>({c:c.id,t:c.t,j,p:p.id,k:Math.min(320,Math.max(100,Math.round(180+(ef(p.ovr)-55)*2.8+R(-34,34+1)))),d:Math.min(320,Math.max(100,Math.round(240-(ef(p.ovr)-55)*2+R(-34,34+1))))})).sort((a,b)=>b.k-a.k||a.d-b.d);
 rows.forEach((r,i)=>{r.pos=i+1;r.pt=+((c.pts[i]??0)+c.pk*r.k).toFixed(2)});rate(c,ps,rows);S.part.push(...rows)}
function simT(){const c=comp();if(!players(c).length)return alert('Sin participantes');while(jorn(c,c.t)<c.nj)simJ(c);closeT()}
function closeT(){const c=comp(),t=c.t,rk=rank(c,t);if(!rk.length)return alert('No hay partidas esta temporada');
 KD(c).forEach(k=>{const r=rank(c,t,k)[0];if(r)S.pal.push({c:c.id,t,tipo:k,id:r.id,n:r.n})});const pr=rankP(c,t),kl=[...pr].sort((a,b)=>b.k-a.k)[0],kd=[...pr].sort((a,b)=>b.k/(b.d||1)-a.k/(a.d||1))[0];
 genAw(t);c.t++;st=null;save()}
function rankP(c,t){const A={};S.part.filter(x=>x.c==c.id&&x.t==t).forEach(x=>{const p=G('jug',x.p);if(!p)return;const a=A[x.p]??={id:x.p,n:p.n,pj:0,k:0,d:0,pt:0,v:0};a.pj++;a.k+=x.k;a.d+=x.d;a.pt+=x.pt;a.v+=x.pos==1});return Object.values(A).sort((a,b)=>b.pt-a.pt||b.k-a.k)}
function rank(c,t,kd='j'){if(kd=='j')return rankP(c,t);if((kd=='n')!=(c.tipo=='n'))return[];const A={},k=kd=='e'?'eq':'nac',L=kd=='e'?'eqs':'nacs';
 S.part.filter(x=>x.c==c.id&&x.t==t).forEach(x=>{const p=G('jug',x.p),g=p&&G(L,p[k]);if(!g)return;const a=A[g.id]??={id:g.id,n:g.n,J:new Set(),pj:0,k:0,d:0,pt:0,v:0};a.J.add(x.j);a.pj=a.J.size;a.k+=x.k;a.d+=x.d;a.pt+=x.pt;a.v+=x.pos==1});return Object.values(A).sort((a,b)=>b.pt-a.pt||b.k-a.k)}
function histoAll(kd){const A={};S.comps.forEach(c=>[...new Set(S.part.filter(x=>x.c==c.id).map(x=>x.t))].forEach(t=>rank(c,t,kd).forEach(r=>{const a=A[r.id]??={id:r.id,n:r.n,pj:0,k:0,d:0,pt:0,v:0};a.pj+=r.pj;a.k+=r.k;a.d+=r.d;a.pt+=r.pt;a.v+=r.v})));return Object.values(A).sort((a,b)=>b.pt-a.pt||b.k-a.k)}
function totCards(){const k=S.part.reduce((s,r)=>s+r.k,0),d=S.part.reduce((s,r)=>s+r.d,0),B=(v,t)=>`<div class=fc><div class=ov>${v}</div><small>${t}</small></div>`;return`<div class=grid style="margin-bottom:10px">${B(new Set(S.part.map(x=>x.c+'|'+x.t+'|'+x.j)).size,'Partidas jugadas')}${B(k,'Kills totales')}${B(d,'Muertes totales')}${B(f2(k/(d||1)),'K/D global')}${B(new Set(S.part.map(x=>x.c+'|'+x.t)).size,'Temporadas jugadas')}${B(S.pal.length,'Títulos entregados')}${B(S.aw.length,'Golden Awards')}</div>`}
function histo(c,kd){const A={};[...new Set(S.part.filter(x=>x.c==c.id).map(x=>x.t))].forEach(t=>rank(c,t,kd).forEach(r=>{const a=A[r.id]??={id:r.id,n:r.n,pj:0,k:0,d:0,pt:0,v:0};a.pj+=r.pj;a.k+=r.k;a.d+=r.d;a.pt+=r.pt;a.v+=r.v}));return Object.values(A).sort((a,b)=>b.pt-a.pt)}
const tab_=(rows,top=0)=>`<div class=w><table><tr><th>#</th><th class=l>Nombre</th><th title="Partidas jugadas">Partidas</th><th>Kills</th><th>Muertes</th><th>K/D</th><th>Vic</th><th>Pts</th></tr>${rows.map((x,i)=>`<tr class="${top&&i<3?'p'+(i+1):''}"><td>${i+1}</td><td class=l>${esc(x.n)}</td><td>${x.pj}</td><td>${x.k}</td><td>${x.d}</td><td>${f2(x.k/(x.d||1))}</td><td>${x.v}</td><td><b>${f2(x.pt)}</b></td></tr>`).join('')||'<tr><td colspan=8 class=mu>Sin partidas todavía</td></tr>'}</table></div>`;
const csel=()=>`<select onchange="sc=this.value;st=null;draw()">${S.comps.map(c=>`<option value="${c.id}" ${c.id==sc?'selected':''}>${c.tipo=='n'?'🌍':'🏆'} ${esc(c.n)}</option>`).join('')}</select>`;
const tsel=c=>{const T=[...new Set(S.part.filter(x=>x.c==c.id).map(x=>x.t).concat(c.t))].sort((a,b)=>a-b);if(st==null)st=c.t;return`<select onchange="st=+this.value;draw()">${T.map(t=>`<option ${t==st?'selected':''}>${t}</option>`).join('')}</select>`};
const V=[()=>{const c=comp();if(!c)return'<div class=card>Crea una competición primero.</div>';return`<div class=card><h2>🎮 Simulador · todos contra todos</h2><div class=row>${csel()}<b>Temporada ${c.t}</b><span class=mu>Jornada ${jorn(c,c.t)}/${c.nj}</span></div><div class=row><button class=bt onclick="simJ(comp());save()">🎲 Simular jornada</button><button class=bt onclick="for(let i=0;i<5&&jorn(comp(),comp().t)<comp().nj;i++)simJ(comp());save()">⏩ 5 jornadas</button><button class=bt onclick="simT()">🏁 Simular temporada completa</button><button class="bt s" onclick="closeT()">Cerrar temporada</button><button class="bt r" onclick="resetT()">🗑 Reiniciar temporada</button></div></div>
${KD(c).map(k=>`<div class=card><h2>${TIPO[k]} · T${c.t}</h2>${tab_(rank(c,c.t,k),1)}</div>`).join('')}${evo(c)}`},
()=>ents('jug','Borrusher','👤'),()=>ents('eqs','Borrusquad','🛡'),()=>ents('nacs','Borrunation','🌍'),
()=>`<div class=card><h2>⚙ Ajustes de media automática</h2><div class=row><label><input type=checkbox ${S.cfg.auto?'checked':''} onchange="S.cfg.auto=this.checked?1:0;save()"> Activar</label><label>Sensibilidad base <input type=number step=.1 min=0 style="width:70px" value=${S.cfg.k} onchange="S.cfg.k=Math.max(0,+this.value);save()"></label></div><p class=mu>Tras cada jornada la media de cada borrusher sube o baja según su puesto comparado con lo esperado por su media. Cambio = sensibilidad × importancia de la competición. Importancia 0 = no cambia la media.</p></div><div class=card><h2>Crear competición</h2><div class=row><input id=cn placeholder="Nombre"><select id=ck><option value=l>🏆 Liga (borrushers y borrusquads)</option><option value=n>🌍 Borrunations</option></select><button class=bt onclick="newC()">➕ Crear</button></div></div>${S.comps.map(c=>{const L=c.tipo=='n'?S.nacs:S.jug;return`<div class=card><div class=row><input value="${esc(c.n)}" onchange="G('comps','${c.id}').n=this.value;save()"><b>${c.tipo=='n'?'🌍 Borrunations':'🏆 Liga'}</b><button class="bt dl" onclick="delC('${c.id}')">✖</button></div><div class=row><label title="Multiplica subidas/bajadas de media y el peso en los Golden Awards">⭐ Importancia <input type=number step=.25 min=0 style="width:70px" value=${c.imp} onchange="G('comps','${c.id}').imp=Math.max(0,+this.value);save()"></label><label>Jornadas/temporada <input type=number style="width:70px" value=${c.nj} onchange="G('comps','${c.id}').nj=+this.value||1;save()"></label><label>Pts por puesto <input style="width:230px" value="${c.pts.join(',')}" onchange="G('comps','${c.id}').pts=this.value.split(',').map(Number);save()"></label><label>Pts/kill <input type=number step=.1 style="width:70px" value=${c.pk} onchange="G('comps','${c.id}').pk=+this.value||0;save()"></label></div><div class=row>${L.map(x=>`<label><input type=checkbox ${c.ids.includes(x.id)?'checked':''} onchange="tg('${c.id}','${x.id}')"> ${esc(x.n)}</label>`).join(' ')||'<span class=mu>Crea participantes primero</span>'}</div>${convUI(c)}</div>`}).join('')}`,
()=>{const c=comp(),ks=st==-2?['j','e','n']:KD(c);if(!ks.includes(sk))sk=ks[0];return`<div class=card><h2>📊 Estadísticas</h2><div class=row>${csel()} Temporada ${tsel(c)} <button class="bt s" onclick="st=-1;draw()">Histórico</button><button class="bt ${st==-2?'':'s'}" onclick="st=-2;draw()">🌐 Total (todas las competiciones)</button></div><div class=row>${ks.map(k=>`<button class="bt ${sk==k?'':'s'}" onclick="sk='${k}';draw()">${TIPO[k]}</button>`).join('')}</div>${st==-2?totCards():''}${tab_(st==-2?histoAll(sk):st==-1?histo(c,sk):rank(c,st,sk))}</div><div class=card><h2>Récords</h2>${recs()}</div>`},
()=>`<div class=card><h2>🥇 Palmarés</h2><div class=w><table><tr><th class=l>Comp.</th><th>Temp.</th><th class=l>Campeón</th><th></th></tr>${S.pal.map((x,i)=>`<tr><td class=l>${esc(G('comps',x.c)?.n||'?')}</td><td>${x.t}</td><td class=l>${TIPO[x.tipo].slice(0,2)} <b>${esc(x.n)}</b></td><td><button class="bt dl" onclick="if(confirm('¿Borrar este campeón?')){S.pal.splice(${i},1);save()}">✖</button></td></tr>`).reverse().join('')||'<tr><td colspan=4 class=mu>Aún no hay campeones: simula una temporada</td></tr>'}</table></div></div>
<div class=card><h2>Añadir campeón manual</h2><div class=row><select id=pc>${S.comps.map(c=>`<option value=${c.id}>${esc(c.n)}</option>`).join('')}</select><input id=pt type=number placeholder=Temp style="width:80px"><select id=pe>${[...S.jug.map(x=>['j',x]),...S.eqs.map(x=>['e',x]),...S.nacs.map(x=>['n',x])].map(([k,x])=>`<option value="${k}|${x.id}">${TIPO[k].slice(0,2)} ${esc(x.n)}</option>`).join('')}</select><button class=bt onclick="addP()">➕</button></div></div>`,
()=>{const T=[...new Set(S.part.map(x=>x.t))].sort((a,b)=>b-a),IC={j:'👤',e:'🛡',n:'🌍'};return`<div class=card><h2>⭐ Golden Awards <small class=mu>· globales (todas las competiciones)</small></h2><div class=row><label>Temporada <select id=gt>${T.map(t=>`<option>${t}</option>`).join('')}</select></label><button class=bt onclick="if($('#gt').value){genAw(+$('#gt').value);save()}">🔄 Generar / recalcular automáticos</button></div><p class=mu>Se crean solos al cerrar cada temporada con las partidas de todas las competiciones, ponderadas por su importancia. Revelación = mayor subida de media de la temporada.</p><div class=w><table><tr><th>Temp.</th><th class=l>Premio</th><th class=l>Ganador</th><th></th></tr>${S.aw.slice().sort((a,b)=>b.t-a.t).map(x=>`<tr><td>${x.t}</td><td class=l>⭐ ${esc(x.pr)}</td><td class=l>${IC[x.k||'j']} <b>${esc(x.n)}</b></td><td><button class="bt dl" onclick="if(confirm('¿Borrar este premio?')){S.aw=S.aw.filter(y=>y.id!='${x.id}');save()}">✖</button></td></tr>`).join('')||'<tr><td colspan=4 class=mu>Se dan solos al cerrar temporada, o créalos abajo</td></tr>'}</table></div></div>
<div class=card><h2>Crear Golden Award manual</h2><div class=row><input id=ap placeholder="Premio (ej. Golden Rookie)"><input id=at type=number placeholder=Temp style="width:80px"><select id=aj>${[...S.jug.map(x=>['j',x]),...S.eqs.map(x=>['e',x]),...S.nacs.map(x=>['n',x])].map(([k,x])=>`<option value="${k}|${x.id}">${IC[k]} ${esc(x.n)}</option>`).join('')}</select><button class=bt onclick="addA()">➕</button></div></div>`},
()=>`<div class=card><h2>💾 Datos</h2><div class=row><button class=bt onclick="exp()">⬇ Exportar</button><button class=bt onclick="$('#imf').click()">⬆ Importar</button><input id=imf type=file accept=.json hidden onchange="imp(this)"><button class="bt r" onclick="if(confirm('¿Borrar TODO y volver a los datos de ejemplo? (se guarda una copia por si acaso)')){localStorage[KEY+'_bak']=localStorage[KEY];S=seed();migrate();save()}">🗑 Reiniciar todo</button><button class="bt s" onclick="restoreBak()">↩ Restaurar copia anterior</button></div><p class=mu>Todo se guarda solo en este navegador y no se borra al actualizar la página. Pulsa <b>Exportar</b> para bajar <b>data.json</b>: es tu copia de seguridad y sirve para llevar tus datos a otro dispositivo o subirlos a GitHub como datos iniciales.</p></div>`];
function ents(a,nm,ic){return`<div class=card><h2>${ic} ${nm}s</h2><div class=row><input id=nn placeholder="Nuevo ${nm.toLowerCase()}"><button class=bt onclick="newE('${a}')">➕ Crear</button></div><div class=grid>${S[a].map(x=>{const t=S.pal.filter(p=>p.id==x.id).length,k=a=='eqs'?'eq':'nac';return`<div class=fc onclick="ficha('${a}','${x.id}')"><div class=ov>${a=='jug'?ov(x):ic}</div><b>${esc(x.n)}</b><small>${a=='jug'?esc(G('eqs',x.eq)?.n||'Sin equipo')+' · '+esc(G('nacs',x.nac)?.n||'Sin selección'):S.jug.filter(p=>p[k]==x.id).length+' borrushers'}</small><br><small>🏆 ${t}</small></div>`}).join('')}</div></div>`}
function ficha(a,id){const x=G(a,id),m=$('#md'),k0=a=='eqs'?'eq':'nac',mem=a=='jug'?[x]:S.jug.filter(p=>p[k0]==id),P=S.part.filter(r=>mem.some(p=>p.id==r.p)&&(a=='jug'||(G('comps',r.c)?.tipo=='n')==(a=='nacs'))),k=P.reduce((s,r)=>s+r.k,0),d=P.reduce((s,r)=>s+r.d,0),aw=S.aw.filter(w=>w.k=='e'||w.k=='n'?w.pid==id:mem.some(p=>p.id==w.pid)),ti=S.pal.filter(p=>p.id==id),pj=a=='jug'?P.length:new Set(P.map(r=>r.c+'|'+r.t+'|'+r.j)).size,mx=P.length?Math.max(...P.map(r=>r.k)):0;
 const sel=(f,L,t)=>`<label>${t} <select onchange="G('jug','${id}').${f}=this.value;save();ficha('jug','${id}')"><option value="">${f=='eq'?'Sin equipo':'Sin selección'}</option>${L.map(y=>`<option value=${y.id} ${x[f]==y.id?'selected':''}>${esc(y.n)}</option>`).join('')}</select></label>`;
 m.hidden=false;m.innerHTML=`<div class=card><div class=row><h2 style="margin:0">${esc(x.n)}</h2><button class="bt s" onclick="$('#md').hidden=true">✖ Cerrar</button></div><div class=row><label>Nombre <input value="${esc(x.n)}" onchange="G('${a}','${id}').n=this.value;save();ficha('${a}','${id}')"></label>${a=='jug'?`<label>Media <input type=number min=1 max=99 style="width:70px" value=${ov(x)} onchange="G('jug','${id}').ovr=Math.min(99,+this.value||50);save();ficha('jug','${id}')"></label>${sel('eq',S.eqs,'Borrusquad')}${sel('nac',S.nacs,'Borrunation')}`:''}</div>
 <div class=grid><div class=fc><div class=ov>${pj}</div><small>Partidas jugadas</small></div><div class=fc><div class=ov>${k}</div><small>Kills</small></div><div class=fc><div class=ov>${d}</div><small>Muertes</small></div><div class=fc><div class=ov>${f2(k/(d||1))}</div><small>K/D</small></div><div class=fc><div class=ov>${ti.length}</div><small>Títulos</small></div><div class=fc><div class=ov>${aw.length}</div><small>Golden Awards</small></div></div>
 ${a!='jug'?`<h2 style="margin-top:12px">Plantilla (${mem.length})</h2><p>${mem.map(p=>`<span style="white-space:nowrap"><a style="cursor:pointer;color:var(--g2)" onclick="ficha('jug','${p.id}')">${esc(p.n)} (${ov(p)})</a> <button class="bt dl" title="Quitar de aquí" onclick="setM('${a}','${id}','${p.id}','')">✖</button></span>`).join(' · ')||'<span class=mu>Vacía</span>'}</p><div class=row><select id=am>${S.jug.filter(p=>p[k0]!=id).map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select><button class=bt onclick="if($('#am').value)setM('${a}','${id}',$('#am').value,'${id}')">➕ Añadir borrusher</button></div>`:''}
 <h2 style="margin-top:12px">ℹ Información</h2><p>${a=='jug'?`Borrusquad: <b>${esc(G('eqs',x.eq)?.n||'Sin equipo')}</b> · Borrunation: <b>${esc(G('nacs',x.nac)?.n||'Sin selección')}</b> · Media: <b>${ov(x)}</b> (${dvs(P)} acumulado) · Mejor partida: <b>${mx} kills</b>`:`<b>${mem.length}</b> borrushers · Media: <b>${mem.length?Math.round(mem.reduce((s,p)=>s+p.ovr,0)/mem.length):0}</b> · Mejor partida de un jugador: <b>${mx} kills</b>`}</p>
 <h2>🏆 Palmarés (${ti.length})</h2><p>${ti.map(t=>`🏆 ${esc(G('comps',t.c)?.n||'?')} · Temporada ${t.t}`).join('<br>')||'<span class=mu>Sin títulos todavía</span>'}</p>
 <h2>⭐ Golden Awards (${aw.length})</h2><p>${aw.map(w=>`⭐ ${esc(w.pr)} · Temporada ${w.t}${a!='jug'?' · '+esc(w.n):''}`).join('<br>')||'<span class=mu>Sin premios todavía</span>'}</p><div class=row style="justify-content:flex-end;margin-top:20px"><button class="bt dl" onclick="delE('${a}','${id}')">🗑 Eliminar</button></div></div>`}
function setM(a,id,pid,v){G('jug',pid)[a=='eqs'?'eq':'nac']=v;save();ficha(a,id)}
function newE(a){const n=$('#nn').value.trim();if(!n)return;const o={id:uid(),n};if(a=='jug')Object.assign(o,{ovr:R(55,90),eq:'',nac:''});S[a].push(o);S.comps.forEach(c=>{if(a=='jug'&&c.tipo!='n'||a=='nacs'&&c.tipo=='n')c.ids.push(o.id)});save()}
function delE(a,id){if(!confirm('¿Eliminar?'))return;S[a]=S[a].filter(x=>x.id!=id);if(a=='jug')S.part=S.part.filter(r=>r.p!=id);else S.jug.forEach(p=>{if(p.eq==id)p.eq='';if(p.nac==id)p.nac=''});S.comps.forEach(c=>c.ids=c.ids.filter(i=>i!=id));$('#md').hidden=true;save()}
function newC(){const n=$('#cn').value.trim(),k=$('#ck').value;if(!n)return;const c={id:uid(),n,tipo:k,ids:(k=='n'?S.nacs:S.jug).map(x=>x.id),t:1,nj:10,pts:PT,pk:0,imp:1,conv:{}};S.comps.push(c);sc=c.id;save()}
function delC(id){if(!confirm('¿Borrar competición y sus partidas?'))return;S.comps=S.comps.filter(x=>x.id!=id);S.part=S.part.filter(x=>x.c!=id);S.pal=S.pal.filter(x=>x.c!=id);S.aw=S.aw.filter(x=>x.c!=id);sc=S.comps[0]?.id;save()}
function tg(c,i){const a=G('comps',c).ids,k=a.indexOf(i);k<0?a.push(i):a.splice(k,1);save()}
function addP(){const[k,id]=$('#pe').value.split('|'),L=k=='j'?'jug':k=='e'?'eqs':'nacs';S.pal.push({c:$('#pc').value,t:+$('#pt').value||1,tipo:k,id,n:G(L,id).n});save()}
function addA(){const p=$('#ap').value.trim();if(!p||!$('#aj').value)return;const[k,id]=$('#aj').value.split('|'),L=k=='j'?'jug':k=='e'?'eqs':'nacs';S.aw.push({id:uid(),pr:p,k,t:+$('#at').value||1,pid:id,n:G(L,id).n});save()}
function recs(){if(!S.part.length)return'<span class=mu>Simula partidas para ver récords</span>';const b=S.part.reduce((m,x)=>x.k>m.k?x:m),p=G('jug',b.p),cnt={};S.pal.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);const t=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];return`<div class=grid><div class=fc><div class=ov>${b.k}</div><small>Más kills en una partida<br>${esc(p?.n||'?')} · T${b.t} J${b.j}</small></div><div class=fc><div class=ov>${new Set(S.part.map(x=>x.c+'|'+x.t+'|'+x.j)).size}</div><small>Partidas jugadas</small></div>${t?`<div class=fc><div class=ov>${t[1]}</div><small>Más títulos<br>${esc(t[0])}</small></div>`:''}</div>`}
function restoreBak(){try{S=JSON.parse(localStorage[KEY+'_bak']);migrate();save()}catch(e){alert('No hay copia anterior')}}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='data.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.jug)throw 0;localStorage[KEY+'_bak']=localStorage[KEY];S=d;migrate();save()}catch(e){alert('Archivo no válido')}};r.readAsText(i.files[0])}
function draw(){$('#nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};draw()">${t}</button>`).join('');if(!G('comps',sc))sc=S.comps[0]?.id;$('#app').innerHTML=V[tab]()}
boot();
</script></body></html>
