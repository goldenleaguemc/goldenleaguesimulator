<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golden League · Simulador</title>
<style>
:root{--bg:#121212;--card:#1d1d1d;--line:#333;--tx:#eee;--mu:#999;--g:#e0a912;--g2:#ffd966}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,Arial,sans-serif}
header{padding:16px;text-align:center;background:linear-gradient(#2a2208,var(--bg))}h1{margin:0;color:var(--g2);letter-spacing:2px;font-size:clamp(22px,5vw,34px)}header small{color:var(--mu)}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;position:sticky;top:0;background:var(--bg);z-index:5}
button,select,input{font:inherit;color:var(--tx);background:#111;border:1px solid var(--line);border-radius:8px;padding:7px 10px}
nav button{background:var(--card);cursor:pointer}nav button.on{background:var(--g);color:#000;font-weight:700;border-color:var(--g)}
.bt{background:var(--g);color:#000;font-weight:700;border:0;cursor:pointer}.bt.r{background:#a33;color:#fff}.bt.s{background:#333;color:var(--tx);font-weight:400}
main{max-width:1000px;margin:auto;padding:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
h2{margin:0 0 10px;color:var(--g);font-size:18px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{background:linear-gradient(160deg,#3a2c00,#15110a);border:2px solid var(--g);border-radius:14px;padding:10px;text-align:center;cursor:pointer;transition:transform .12s}.fc:hover{transform:translateY(-3px)}
.fc b{display:block;font-size:16px}.fc .ov{font-size:30px;font-weight:900;color:var(--g2)}.fc small{color:var(--mu)}
table{border-collapse:collapse;width:100%}th,td{padding:6px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--g)}td.l,th.l{text-align:left}.w{overflow-x:auto}
tr.p1 td{background:#3d3208}tr.p2 td{background:#2b2b2b}tr.p3 td{background:#3a2412}
#md{position:fixed;inset:0;background:#000d;z-index:20;overflow:auto;padding:12px}#md[hidden]{display:none}#md .card{max-width:640px;margin:20px auto}
.mu{color:var(--mu)}label{font-size:13px;color:var(--mu)}
</style></head><body>
<header><h1>🏆 GOLDEN LEAGUE · SIMULADOR</h1><small>Crea, edita y simula todo · se guarda en tu navegador</small></header>
<nav id="nav"></nav><main id="app"></main><div id="md" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),uid=()=>Math.random().toString(36).slice(2,8),R=(a,b)=>a+Math.random()*(b-a)|0,f2=n=>(+n).toFixed(2).replace(/\.00$/,'');
const KEY='gl_sim_v2',TABS=['🎮 Simulador','👤 Borrushers','🛡 Borrusquads','🌍 Borrunations','🏆 Competiciones','📊 Estadísticas','🥇 Palmarés','⭐ Golden Awards','💾 Datos'],PT=[15,12,10,8,7,6,5,4,3,2,1,0];
const KD=c=>c.tipo=='n'?['n','j']:['j','e'],TIPO={j:'👤 Borrushers',e:'🛡 Borrusquads',n:'🌍 Borrunations'};
let S,tab=0,sc=null,st=null,sk='j';
function seed(){const N=['Steve','Alex','Notch','Herobrine','Creeper','Enderman','Zombie','Skeleton','Slime','Ghast','Blaze','Wither','Piglin','Drowned','Phantom','Warden'],E=['Dragones','Creepers','Piglins','Endermen'].map(n=>({id:uid(),n})),C=['España','México','Argentina','Chile'].map(n=>({id:uid(),n}));
const jug=N.map((n,i)=>({id:uid(),n,ovr:R(55,95),eq:E[i%4].id,nac:C[(i>>2)%4].id})),mk=(n,tipo='l')=>({id:uid(),n,tipo,ids:(tipo=='n'?C:jug).map(x=>x.id),t:1,nj:10,pts:PT,pk:0});
return{jug,eqs:E,nacs:C,comps:[mk('Golden League'),mk('Golden Cup'),mk('Mundial Borrunations','n')],part:[],pal:[],aw:[]}}
function load(){try{S=JSON.parse(localStorage[KEY])}catch(e){S=null}if(!S||!S.jug||S.comps.some(c=>!['l','n'].includes(c.tipo)))S=seed();sc=S.comps[0]?.id}
const save=()=>{localStorage[KEY]=JSON.stringify(S);draw()},G=(a,id)=>S[a].find(x=>x.id==id),comp=()=>G('comps',sc)||S.comps[0];
const players=c=>S.jug.filter(p=>c.ids.includes(c.tipo=='n'?p.nac:p.id));
function jorn(c,t){return Math.max(0,...S.part.filter(x=>x.c==c.id&&x.t==t).map(x=>x.j))}
function simJ(c){const ps=players(c);if(!ps.length)return alert('Esta competición no tiene participantes');const j=jorn(c,c.t)+1;
 const rows=ps.map(p=>({c:c.id,t:c.t,j,p:p.id,k:Math.min(320,Math.max(100,Math.round(180+(p.ovr-55)*1.8+R(-35,36)))),d:Math.min(320,Math.max(100,Math.round(240-(p.ovr-55)*1.3+R(-35,36))))})).sort((a,b)=>b.k-a.k||a.d-b.d);
 rows.forEach((r,i)=>{r.pos=i+1;r.pt=+((c.pts[i]??0)+c.pk*r.k).toFixed(2)});S.part.push(...rows)}
function simT(){const c=comp();if(!players(c).length)return alert('Sin participantes');while(jorn(c,c.t)<c.nj)simJ(c);closeT()}
function closeT(){const c=comp(),t=c.t,rk=rank(c,t);if(!rk.length)return alert('No hay partidas esta temporada');
 KD(c).forEach(k=>{const r=rank(c,t,k)[0];if(r)S.pal.push({c:c.id,t,tipo:k,id:r.id,n:r.n})});const pr=rankP(c,t),kl=[...pr].sort((a,b)=>b.k-a.k)[0],kd=[...pr].sort((a,b)=>b.k/(b.d||1)-a.k/(a.d||1))[0];
 [['MVP',pr[0]],['Máximo killer',kl],['Mejor K/D',kd]].forEach(([n,x])=>x&&S.aw.push({id:uid(),pr:n,c:c.id,t,pid:x.id,n:x.n}));c.t++;st=null;save()}
function rankP(c,t){const A={};S.part.filter(x=>x.c==c.id&&x.t==t).forEach(x=>{const p=G('jug',x.p);if(!p)return;const a=A[x.p]??={id:x.p,n:p.n,pj:0,k:0,d:0,pt:0,v:0};a.pj++;a.k+=x.k;a.d+=x.d;a.pt+=x.pt;a.v+=x.pos==1});return Object.values(A).sort((a,b)=>b.pt-a.pt||b.k-a.k)}
function rank(c,t,kd='j'){if(kd=='j')return rankP(c,t);const A={},k=kd=='e'?'eq':'nac',L=kd=='e'?'eqs':'nacs';
 rankP(c,t).forEach(x=>{const g=G(L,G('jug',x.id)[k]);if(!g)return;const a=A[g.id]??={id:g.id,n:g.n,pj:0,k:0,d:0,pt:0,v:0};a.pj+=x.pj;a.k+=x.k;a.d+=x.d;a.pt+=x.pt;a.v+=x.v});return Object.values(A).sort((a,b)=>b.pt-a.pt||b.k-a.k)}
function histo(c,kd){const A={};[...new Set(S.part.filter(x=>x.c==c.id).map(x=>x.t))].forEach(t=>rank(c,t,kd).forEach(r=>{const a=A[r.id]??={id:r.id,n:r.n,pj:0,k:0,d:0,pt:0,v:0};a.pj+=r.pj;a.k+=r.k;a.d+=r.d;a.pt+=r.pt;a.v+=r.v}));return Object.values(A).sort((a,b)=>b.pt-a.pt)}
const tab_=(rows,top=0)=>`<div class=w><table><tr><th>#</th><th class=l>Nombre</th><th>PJ</th><th>Kills</th><th>Muertes</th><th>K/D</th><th>Vic</th><th>Pts</th></tr>${rows.map((x,i)=>`<tr class="${top&&i<3?'p'+(i+1):''}"><td>${i+1}</td><td class=l>${esc(x.n)}</td><td>${x.pj}</td><td>${x.k}</td><td>${x.d}</td><td>${f2(x.k/(x.d||1))}</td><td>${x.v}</td><td><b>${f2(x.pt)}</b></td></tr>`).join('')||'<tr><td colspan=8 class=mu>Sin partidas todavía</td></tr>'}</table></div>`;
const csel=()=>`<select onchange="sc=this.value;st=null;draw()">${S.comps.map(c=>`<option value="${c.id}" ${c.id==sc?'selected':''}>${c.tipo=='n'?'🌍':'🏆'} ${esc(c.n)}</option>`).join('')}</select>`;
const tsel=c=>{const T=[...new Set(S.part.filter(x=>x.c==c.id).map(x=>x.t).concat(c.t))].sort((a,b)=>a-b);if(st==null)st=c.t;return`<select onchange="st=+this.value;draw()">${T.map(t=>`<option ${t==st?'selected':''}>${t}</option>`).join('')}</select>`};
const V=[()=>{const c=comp();if(!c)return'<div class=card>Crea una competición primero.</div>';return`<div class=card><h2>🎮 Simulador · todos contra todos</h2><div class=row>${csel()}<b>Temporada ${c.t}</b><span class=mu>Jornada ${jorn(c,c.t)}/${c.nj}</span></div><div class=row><button class=bt onclick="simJ(comp());save()">🎲 Simular jornada</button><button class=bt onclick="for(let i=0;i<5&&jorn(comp(),comp().t)<comp().nj;i++)simJ(comp());save()">⏩ 5 jornadas</button><button class=bt onclick="simT()">🏁 Simular temporada completa</button><button class="bt s" onclick="closeT()">Cerrar temporada</button><button class="bt r" onclick="if(confirm('¿Borrar partidas de la temporada actual?')){S.part=S.part.filter(x=>!(x.c==comp().id&&x.t==comp().t));save()}">🗑 Reiniciar temporada</button></div></div>
${KD(c).map(k=>`<div class=card><h2>${TIPO[k]} · T${c.t}</h2>${tab_(rank(c,c.t,k),1)}</div>`).join('')}`},
()=>ents('jug','Borrusher','👤'),()=>ents('eqs','Borrusquad','🛡'),()=>ents('nacs','Borrunation','🌍'),
()=>`<div class=card><h2>Crear competición</h2><div class=row><input id=cn placeholder="Nombre"><select id=ck><option value=l>🏆 Liga (borrushers y borrusquads)</option><option value=n>🌍 Borrunations</option></select><button class=bt onclick="newC()">➕ Crear</button></div></div>${S.comps.map(c=>{const L=c.tipo=='n'?S.nacs:S.jug;return`<div class=card><div class=row><input value="${esc(c.n)}" onchange="G('comps','${c.id}').n=this.value;save()"><b>${c.tipo=='n'?'🌍 Borrunations':'🏆 Liga'}</b><button class="bt r" onclick="delC('${c.id}')">✖</button></div><div class=row><label>Jornadas/temporada <input type=number style="width:70px" value=${c.nj} onchange="G('comps','${c.id}').nj=+this.value||1;save()"></label><label>Pts por puesto <input style="width:230px" value="${c.pts.join(',')}" onchange="G('comps','${c.id}').pts=this.value.split(',').map(Number);save()"></label><label>Pts/kill <input type=number step=.1 style="width:70px" value=${c.pk} onchange="G('comps','${c.id}').pk=+this.value||0;save()"></label></div><div class=row>${L.map(x=>`<label><input type=checkbox ${c.ids.includes(x.id)?'checked':''} onchange="tg('${c.id}','${x.id}')"> ${esc(x.n)}</label>`).join(' ')||'<span class=mu>Crea participantes primero</span>'}</div></div>`}).join('')}`,
()=>{const c=comp(),ks=KD(c);if(!ks.includes(sk))sk=ks[0];return`<div class=card><h2>📊 Estadísticas</h2><div class=row>${csel()} Temporada ${tsel(c)} <button class="bt s" onclick="st=-1;draw()">Histórico</button></div><div class=row>${ks.map(k=>`<button class="bt ${sk==k?'':'s'}" onclick="sk='${k}';draw()">${TIPO[k]}</button>`).join('')}</div>${tab_(st==-1?histo(c,sk):rank(c,st,sk))}</div><div class=card><h2>Récords</h2>${recs()}</div>`},
()=>`<div class=card><h2>🥇 Palmarés</h2><div class=w><table><tr><th class=l>Comp.</th><th>Temp.</th><th class=l>Campeón</th><th></th></tr>${S.pal.map((x,i)=>`<tr><td class=l>${esc(G('comps',x.c)?.n||'?')}</td><td>${x.t}</td><td class=l>${TIPO[x.tipo].slice(0,2)} <b>${esc(x.n)}</b></td><td><button class="bt r" onclick="S.pal.splice(${i},1);save()">✖</button></td></tr>`).reverse().join('')||'<tr><td colspan=4 class=mu>Aún no hay campeones: simula una temporada</td></tr>'}</table></div></div>
<div class=card><h2>Añadir campeón manual</h2><div class=row><select id=pc>${S.comps.map(c=>`<option value=${c.id}>${esc(c.n)}</option>`).join('')}</select><input id=pt type=number placeholder=Temp style="width:80px"><select id=pe>${[...S.jug.map(x=>['j',x]),...S.eqs.map(x=>['e',x]),...S.nacs.map(x=>['n',x])].map(([k,x])=>`<option value="${k}|${x.id}">${TIPO[k].slice(0,2)} ${esc(x.n)}</option>`).join('')}</select><button class=bt onclick="addP()">➕</button></div></div>`,
()=>`<div class=card><h2>⭐ Golden Awards</h2><div class=w><table><tr><th>Temp.</th><th class=l>Premio</th><th class=l>Ganador</th><th class=l>Comp.</th><th></th></tr>${S.aw.slice().reverse().map(x=>`<tr><td>${x.t}</td><td class=l>⭐ ${esc(x.pr)}</td><td class=l><b>${esc(x.n)}</b></td><td class=l>${esc(G('comps',x.c)?.n||'?')}</td><td><button class="bt r" onclick="S.aw=S.aw.filter(y=>y.id!='${x.id}');save()">✖</button></td></tr>`).join('')||'<tr><td colspan=5 class=mu>Se dan solos al cerrar temporada, o créalos abajo</td></tr>'}</table></div></div>
<div class=card><h2>Crear Golden Award</h2><div class=row><input id=ap placeholder="Premio (ej. Golden Rookie)"><select id=ac>${S.comps.map(c=>`<option value=${c.id}>${esc(c.n)}</option>`).join('')}</select><input id=at type=number placeholder=Temp style="width:80px"><select id=aj>${S.jug.map(x=>`<option value=${x.id}>${esc(x.n)}</option>`).join('')}</select><button class=bt onclick="addA()">➕</button></div></div>`,
()=>`<div class=card><h2>💾 Datos</h2><div class=row><button class=bt onclick="exp()">⬇ Exportar</button><button class=bt onclick="$('#imf').click()">⬆ Importar</button><input id=imf type=file accept=.json hidden onchange="imp(this)"><button class="bt r" onclick="if(confirm('¿Volver a los datos de ejemplo?')){S=seed();sc=S.comps[0].id;save()}">🗑 Reiniciar todo</button></div><p class=mu>Todo se guarda en este navegador. Exporta para llevarte tus datos a otro dispositivo.</p></div>`];
function ents(a,nm,ic){return`<div class=card><h2>${ic} ${nm}s</h2><div class=row><input id=nn placeholder="Nuevo ${nm.toLowerCase()}"><button class=bt onclick="newE('${a}')">➕ Crear</button></div><div class=grid>${S[a].map(x=>{const t=S.pal.filter(p=>p.id==x.id).length,k=a=='eqs'?'eq':'nac';return`<div class=fc onclick="ficha('${a}','${x.id}')"><div class=ov>${a=='jug'?x.ovr:ic}</div><b>${esc(x.n)}</b><small>${a=='jug'?esc(G('eqs',x.eq)?.n||'Sin equipo'):S.jug.filter(p=>p[k]==x.id).length+' borrushers'}</small><br><small>🏆 ${t}</small></div>`}).join('')}</div></div>`}
function ficha(a,id){const x=G(a,id),m=$('#md'),k0=a=='eqs'?'eq':'nac',mem=a=='jug'?[x]:S.jug.filter(p=>p[k0]==id),P=S.part.filter(r=>mem.some(p=>p.id==r.p)),k=P.reduce((s,r)=>s+r.k,0),d=P.reduce((s,r)=>s+r.d,0),aw=S.aw.filter(w=>a=='jug'&&w.pid==id),ti=S.pal.filter(p=>p.id==id);
 const sel=(f,L,t)=>`<label>${t} <select onchange="G('jug','${id}').${f}=this.value;save();ficha('jug','${id}')">${L.map(y=>`<option value=${y.id} ${x[f]==y.id?'selected':''}>${esc(y.n)}</option>`).join('')}</select></label>`;
 m.hidden=false;m.innerHTML=`<div class=card><div class=row><h2 style="margin:0">${esc(x.n)}</h2><button class="bt s" onclick="$('#md').hidden=true">✖ Cerrar</button></div><div class=row><label>Nombre <input value="${esc(x.n)}" onchange="G('${a}','${id}').n=this.value;save();ficha('${a}','${id}')"></label>${a=='jug'?`<label>Media <input type=number min=1 max=99 style="width:70px" value=${x.ovr} onchange="G('jug','${id}').ovr=Math.min(99,+this.value||50);save();ficha('jug','${id}')"></label>${sel('eq',S.eqs,'Borrusquad')}${sel('nac',S.nacs,'Borrunation')}`:''}</div>
 <div class=grid><div class=fc><div class=ov>${P.length}</div><small>Registros</small></div><div class=fc><div class=ov>${k}</div><small>Kills</small></div><div class=fc><div class=ov>${d}</div><small>Muertes</small></div><div class=fc><div class=ov>${f2(k/(d||1))}</div><small>K/D</small></div><div class=fc><div class=ov>${ti.length}</div><small>Títulos</small></div><div class=fc><div class=ov>${aw.length}</div><small>Golden Awards</small></div></div>
 ${a!='jug'?`<h2 style="margin-top:12px">Plantilla</h2><p>${mem.map(p=>`<a style="cursor:pointer;color:var(--g2)" onclick="ficha('jug','${p.id}')">${esc(p.n)} (${p.ovr})</a>`).join(' · ')||'<span class=mu>Vacía</span>'}</p>`:''}
 <p>${ti.map(t=>`🏆 ${esc(G('comps',t.c)?.n||'?')} T${t.t}`).join('<br>')}${aw.map(w=>`<br>⭐ ${esc(w.pr)} T${w.t}`).join('')}</p><button class="bt r" onclick="delE('${a}','${id}')">🗑 Eliminar</button></div>`}
function newE(a){const n=$('#nn').value.trim();if(!n)return;const o={id:uid(),n};if(a=='jug')Object.assign(o,{ovr:R(55,90),eq:S.eqs[0]?.id,nac:S.nacs[0]?.id});S[a].push(o);S.comps.forEach(c=>{if(a=='jug'&&c.tipo!='n'||a=='nacs'&&c.tipo=='n')c.ids.push(o.id)});save()}
function delE(a,id){if(!confirm('¿Eliminar?'))return;S[a]=S[a].filter(x=>x.id!=id);if(a=='jug')S.part=S.part.filter(r=>r.p!=id);else S.jug.forEach(p=>{if(p.eq==id)p.eq=S.eqs[0]?.id;if(p.nac==id)p.nac=S.nacs[0]?.id});S.comps.forEach(c=>c.ids=c.ids.filter(i=>i!=id));$('#md').hidden=true;save()}
function newC(){const n=$('#cn').value.trim(),k=$('#ck').value;if(!n)return;const c={id:uid(),n,tipo:k,ids:(k=='n'?S.nacs:S.jug).map(x=>x.id),t:1,nj:10,pts:PT,pk:0};S.comps.push(c);sc=c.id;save()}
function delC(id){if(!confirm('¿Borrar competición y sus partidas?'))return;S.comps=S.comps.filter(x=>x.id!=id);S.part=S.part.filter(x=>x.c!=id);S.pal=S.pal.filter(x=>x.c!=id);S.aw=S.aw.filter(x=>x.c!=id);sc=S.comps[0]?.id;save()}
function tg(c,i){const a=G('comps',c).ids,k=a.indexOf(i);k<0?a.push(i):a.splice(k,1);save()}
function addP(){const[k,id]=$('#pe').value.split('|'),L=k=='j'?'jug':k=='e'?'eqs':'nacs';S.pal.push({c:$('#pc').value,t:+$('#pt').value||1,tipo:k,id,n:G(L,id).n});save()}
function addA(){const p=$('#ap').value.trim();if(!p||!S.jug.length)return;S.aw.push({id:uid(),pr:p,c:$('#ac').value,t:+$('#at').value||1,pid:$('#aj').value,n:G('jug',$('#aj').value).n});save()}
function recs(){if(!S.part.length)return'<span class=mu>Simula partidas para ver récords</span>';const b=S.part.reduce((m,x)=>x.k>m.k?x:m),p=G('jug',b.p),cnt={};S.pal.forEach(x=>cnt[x.n]=(cnt[x.n]||0)+1);const t=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];return`<div class=grid><div class=fc><div class=ov>${b.k}</div><small>Más kills en una partida<br>${esc(p?.n||'?')} · T${b.t} J${b.j}</small></div><div class=fc><div class=ov>${S.part.length}</div><small>Registros de partida</small></div>${t?`<div class=fc><div class=ov>${t[1]}</div><small>Más títulos<br>${esc(t[0])}</small></div>`:''}</div>`}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)]));a.download='golden-league-sim.json';a.click()}
function imp(i){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.jug)throw 0;S=d;sc=S.comps[0]?.id;save()}catch(e){alert('Archivo no válido')}};r.readAsText(i.files[0])}
function draw(){$('#nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="tab=${i};draw()">${t}</button>`).join('');if(!G('comps',sc))sc=S.comps[0]?.id;$('#app').innerHTML=V[tab]()}
load();draw();
</script></body></html>
